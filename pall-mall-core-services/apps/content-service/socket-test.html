<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socket.io Tester | Pall Mall</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #22c55e;
            --error: #ef4444;
        }

        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 350px;
            background-color: var(--card-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 20px;
            overflow-y: auto;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 20px;
            overflow: hidden;
        }

        h1, h2 {
            margin: 0;
            font-weight: 600;
        }

        h1 { font-size: 1.5rem; color: var(--primary); }
        h2 { font-size: 1rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.875rem;
            padding: 8px 12px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.05);
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--error);
        }

        .dot.connected { background-color: var(--success); }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label { font-size: 0.875rem; color: var(--text-muted); }

        input, textarea, select {
            background-color: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px;
            border-radius: 6px;
            font-family: inherit;
        }

        input:focus { outline: 2px solid var(--primary); border-color: transparent; }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }

        button:hover { background-color: var(--primary-hover); }
        button.secondary { background-color: transparent; border: 1px solid var(--border); color: var(--text); }
        button.secondary:hover { background-color: rgba(255, 255, 255, 0.05); }

        .log-container {
            flex: 1;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column-reverse;
            gap: 10px;
        }

        .log-entry {
            padding: 10px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.03);
            border-left: 3px solid var(--primary);
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 0.8125rem;
            white-space: pre-wrap;
        }

        .log-entry.event-typing { border-color: #fbbf24; }
        .log-entry.event-error { border-color: var(--error); }
        .log-entry.event-success { border-color: var(--success); }

        .timestamp { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 5px; }
        .event-name { font-weight: bold; color: var(--primary); margin-bottom: 5px; }

        .actions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h1>PM Socket Tester</h1>
        <div class="status">
            <div id="connection-dot" class="dot"></div>
            <span id="connection-status">Disconnected</span>
        </div>

        <div class="form-group">
            <label for="server-url">Server URL</label>
            <input type="text" id="server-url" value="http://localhost:3003">
        </div>

        <button id="connect-btn">Connect</button>
        <button id="disconnect-btn" class="secondary" style="display:none">Disconnect</button>

        <hr style="width: 100%; border: 0; border-top: 1px solid var(--border); margin: 10px 0;">

        <h2>1. Join Room</h2>
        <div class="form-group">
            <label for="thread-id">Thread ID</label>
            <input type="text" id="thread-id" placeholder="e.g. 123">
        </div>
        <button id="join-btn" class="secondary">Join Thread Room</button>

        <h2>2. Auth Context</h2>
        <div class="form-group">
            <label for="user-id">User ID</label>
            <input type="text" id="user-id" value="system-test-user">
        </div>
        <div class="form-group">
            <label for="user-role">Role</label>
            <select id="user-role">
                <option value="patient">Patient</option>
                <option value="admin">Admin</option>
                <option value="doctor">Doctor</option>
                <option value="nurse">Nurse</option>
            </select>
        </div>

        <h2>3. Emit Events</h2>
        <div class="actions-grid">
            <button id="get-threads-btn" class="secondary">Get Threads</button>
            <button id="get-messages-btn" class="secondary">Get Messages</button>
            <button id="typing-btn" class="secondary">Send Typing</button>
        </div>
    </div>

    <div class="main">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2>Event Logs</h2>
            <button id="clear-logs" class="secondary" style="padding: 4px 10px; font-size: 0.75rem;">Clear Logs</button>
        </div>
        <div class="log-container" id="log-container">
            <!-- Logs appear here -->
        </div>
    </div>

    <script>
        let socket;
        const logContainer = document.getElementById('log-container');
        const connectionDot = document.getElementById('connection-dot');
        const connectionStatus = document.getElementById('connection-status');
        const connectBtn = document.getElementById('connect-btn');
        const disconnectBtn = document.getElementById('disconnect-btn');

        function addLog(event, data, type = '') {
            const entry = document.createElement('div');
            entry.className = `log-entry event-${type}`;
            
            const timestamp = new Date().toLocaleTimeString();
            
            const isTyping = event === 'typing';
            const userDisplay = isTyping ? `<strong>${data.userName}</strong> (${data.userRole})` : data.user_id || data.userId || 'system';

            entry.innerHTML = `
                <div class="timestamp">${timestamp}</div>
                <div class="event-name">${event} ${isTyping ? 'indicator' : ''}</div>
                ${isTyping ? `<div style="margin-bottom: 5px; color: #fbbf24;">${userDisplay} is typing...</div>` : ''}
                <div>${JSON.stringify(data, null, 2)}</div>
            `;
            
            logContainer.prepend(entry);
        }

        document.getElementById('connect-btn').onclick = () => {
            const url = document.getElementById('server-url').value;
            
            if (socket) socket.disconnect();
            
            socket = io(url);

            socket.on('connect', () => {
                connectionDot.classList.add('connected');
                connectionStatus.innerText = 'Connected: ' + socket.id;
                connectBtn.style.display = 'none';
                disconnectBtn.style.display = 'block';
                addLog('System', 'Connected to ' + url, 'success');
            });

            socket.on('disconnect', () => {
                connectionDot.classList.remove('connected');
                connectionStatus.innerText = 'Disconnected';
                connectBtn.style.display = 'block';
                disconnectBtn.style.display = 'none';
                addLog('System', 'Disconnected', 'error');
            });

            socket.on('connect_error', (error) => {
                addLog('Connection Error', error.message, 'error');
            });

            // Listen for all events defined in gateway
            const events = ['typing', 'threads_list', 'messages_list', 'new_message', 'internal_note_added', 'message_read', 'thread_updated', 'error'];
            
            events.forEach(event => {
                socket.on(event, (data) => {
                    addLog(event, data, event);
                });
            });
        };

        document.getElementById('disconnect-btn').onclick = () => {
            if (socket) socket.disconnect();
        };

        document.getElementById('join-btn').onclick = () => {
            const threadId = document.getElementById('thread-id').value;
            if (!threadId) return alert('Enter a Thread ID');
            
            socket.emit('join_thread', { thread_id: threadId });
            addLog('Emit', `join_thread: ${threadId}`);
        };

        document.getElementById('get-threads-btn').onclick = () => {
            const userId = document.getElementById('user-id').value;
            const role = document.getElementById('user-role').value;
            
            socket.emit('get_threads', {
                userId,
                role,
                query: { page: 1, limit: 10 }
            });
            addLog('Emit', 'get_threads');
        };

        document.getElementById('get-messages-btn').onclick = () => {
            const userId = document.getElementById('user-id').value;
            const role = document.getElementById('user-role').value;
            const threadId = document.getElementById('thread-id').value;
            
            if (!threadId) return alert('Enter a Thread ID');

            socket.emit('get_messages', {
                userId,
                role,
                thread_id: threadId
            });
            addLog('Emit', 'get_messages');
        };

        document.getElementById('typing-btn').onclick = () => {
            const userId = document.getElementById('user-id').value;
            const threadId = document.getElementById('thread-id').value;
            
            if (!threadId) return alert('Enter a Thread ID');

            socket.emit('typing', {
                thread_id: threadId,
                user_id: userId
            });
            addLog('Emit', 'typing');
        };

        document.getElementById('clear-logs').onclick = () => {
            logContainer.innerHTML = '';
        };
    </script>
</body>
</html>
